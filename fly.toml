# fly.toml app configuration file generated for dav-cloud on 2026-02-03T13:00:57+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dav-cloud'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256

[mounts]
  source = "davcloud_storage"
  destination = "/mnt/davcloud_storage"

[experimental]
    cmd = ["sh", "-c", "rm -rf data; ln -Fs /mnt/davcloud_storage/data data; apache2-foreground"]


